<body>
  <header class="header">
    <div class="header__container">
      <img class="header__logo" src="src/img/logo-gathsession.svg" alt="Gath Session Logo">
      <nav class="header__nav">
        <ul>
          <li><a class="active" href="#">Home</a></li>
          <li><a href="#">Features</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <section class="hero">
        <div class="hero__content">
          <h1 class="hero__title">Build your best community starting from here.</h1>
          <p class="hero__description">Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way</p>

        <div class="hero__image">

          <img class="hero__image-5" src="src/img/chica-sonrisa.png" alt="Chica sonriendo">

    <section class="items">
      <article>
        <img class="items__img" src="src/img/build-community-logo.svg" alt="icono de comunidad">
        <h2 class="items__title">Build Community</h2>
      </article>
      <article>
        <img class="items__img" src="src/img/share-events-logo.svg" alt="icono de calendario">
        <h2 class="items__title">Share Events</h2>
      </article>
      <article>
        <img class="items__img" src="src/img/get-information-logo.svg" alt="icono de información">
        <h2 class="items__title">Get Information</h2>
      </article>
